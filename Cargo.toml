[workspace]
resolver = "2"
members = [
    "crates/kaffein",
    "crates/kaffein-app",
    "crates/kaffein-domain",
    "crates/kaffein-i18n",
    "crates/kaffein-infra",
    "crates/kaffein-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/kaffein/kaffein"

[workspace.dependencies]
kaffein-app = { path = "crates/kaffein-app" }
kaffein-domain = { path = "crates/kaffein-domain" }
kaffein-i18n = { path = "crates/kaffein-i18n" }
kaffein-infra = { path = "crates/kaffein-infra" }
kaffein-ui = { path = "crates/kaffein-ui" }

eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29.1"
